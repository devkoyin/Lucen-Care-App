<div class="my-posts-page">
  <div class="my-posts-page__header">
    <h2 class="my-posts-page__title">My Posts</h2>
    <p class="my-posts-page__sub">Articles and clinical insights you've shared with patients</p>
  </div>

  <div class="post-list">
    @for (p of posts; track p.id) {
      <div class="post-card">
        <div class="post-card__top">
          <div class="post-card__tags">
            <span class="post-card__community"
                  [style.color]="p.communityColor"
                  [style.border-color]="p.communityColor + '44'"
                  [style.background]="p.communityColor + '15'">
              {{ p.community }}
            </span>
            <span class="post-card__tag">{{ p.tag }}</span>
          </div>
          <span class="post-card__time">{{ p.timeAgo }}</span>
        </div>
        <p class="post-card__title">{{ p.title }}</p>
        <div class="post-card__footer">
          <span class="post-card__stat">❤️ {{ p.likes }}</span>
          <span class="post-card__stat">💬 {{ p.comments }}</span>
          <button class="post-card__btn">View Post</button>
        </div>
      </div>
    }
  </div>
</div>

<div class="threads-page">
  <div class="threads-page__header">
    <div>
      <h2 class="threads-page__title">Unanswered Questions</h2>
      <p class="threads-page__sub">Posts from the community nobody has replied to yet</p>
    </div>
    @if (threads().length > 0) {
      <span class="threads-page__urgent-badge">{{ threads().length }} waiting</span>
    }
  </div>

  <lc-post-summary-list
    [posts]="threads()"
    [loading]="loading()"
    [loadError]="loadError()"
    actionLabel="Answer"
    emptyText="Every question has an answer. Nothing waiting right now." />
</div>

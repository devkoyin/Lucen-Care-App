<div class="pro-dashboard">

  <div class="pro-dashboard__topbar">
    <div>
      <h1 class="pro-dashboard__title">Welcome back, {{ displayName }}</h1>
      <p class="pro-dashboard__sub">Your community activity and patient questions at a glance</p>
    </div>
    <a class="pro-dashboard__cta" routerLink="/professional/community">+ New Post</a>
  </div>

  <!-- Real counts from GET /community/stats. The strip that used to sit below this
       carried four figures no table could ever back. -->
  <div class="pro-dashboard__stats">
    @for (s of stats(); track s.label) {
      <div class="pro-stat">
        <span class="pro-stat__icon">{{ s.icon }}</span>
        <span class="pro-stat__value">{{ s.value }}</span>
        <span class="pro-stat__label">{{ s.label }}</span>
      </div>
    }
  </div>

  <nav class="pro-nav">
    <a class="pro-nav__tab"
       routerLink="/professional/dashboard/threads"
       routerLinkActive="pro-nav__tab--active"
       [routerLinkActiveOptions]="{ exact: true }">
      🚨 Patient Threads
    </a>
    <a class="pro-nav__tab"
       routerLink="/professional/dashboard/posts"
       routerLinkActive="pro-nav__tab--active"
       [routerLinkActiveOptions]="{ exact: true }">
      📝 My Posts
    </a>
  </nav>

  <router-outlet />

</div>

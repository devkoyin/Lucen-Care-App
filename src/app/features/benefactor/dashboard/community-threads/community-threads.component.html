<div class="threads-page">
  <div class="threads-page__header">
    <h2 class="threads-page__title">Active Community Threads</h2>
    <p class="threads-page__sub">Recent conversations in the communities you have joined</p>
  </div>

  <lc-post-summary-list
    [posts]="threads()"
    [loading]="loading()"
    [loadError]="loadError()"
    actionLabel="View thread"
    emptyText="Join a community to see its conversations here." />
</div>

<div class="my-posts-page">
  <div class="my-posts-page__header">
    <h2 class="my-posts-page__title">My Posts</h2>
    <p class="my-posts-page__sub">What you've shared with the community</p>
  </div>

  <lc-post-summary-list
    [posts]="posts()"
    [loading]="loading()"
    [loadError]="loadError()"
    [showRemoved]="true"
    actionLabel="View thread"
    emptyText="You haven't posted yet." />
</div>

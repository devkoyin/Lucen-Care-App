<div class="ben-dashboard">

  <div class="ben-dashboard__topbar">
    <div>
      <h1 class="ben-dashboard__title">Welcome back, {{ displayName }}</h1>
      <p class="ben-dashboard__sub">Your community activity at a glance</p>
    </div>
    <a class="ben-dashboard__cta" routerLink="/benefactor/community">+ New Post</a>
  </div>

  <!-- Real counts from GET /community/stats. -->
  <div class="ben-dashboard__stats">
    @for (s of stats(); track s.label) {
      <div class="ben-stat">
        <span class="ben-stat__icon">{{ s.icon }}</span>
        <span class="ben-stat__value">{{ s.value }}</span>
        <span class="ben-stat__label">{{ s.label }}</span>
      </div>
    }
  </div>

  <nav class="ben-nav">
    <a class="ben-nav__tab"
       routerLink="/benefactor/dashboard/threads"
       routerLinkActive="ben-nav__tab--active"
       [routerLinkActiveOptions]="{ exact: true }">
      💬 Community Threads
    </a>
    <a class="ben-nav__tab"
       routerLink="/benefactor/dashboard/posts"
       routerLinkActive="ben-nav__tab--active"
       [routerLinkActiveOptions]="{ exact: true }">
      📝 My Posts
    </a>
  </nav>

  <router-outlet />

</div>

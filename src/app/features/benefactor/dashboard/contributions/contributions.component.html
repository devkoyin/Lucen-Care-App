<div class="contributions-page">
  <div class="contributions-page__header">
    <div>
      <h2 class="contributions-page__title">My Programme Contributions</h2>
      <p class="contributions-page__sub">Track all the health programmes you've supported</p>
    </div>
    <span class="contributions-page__total">
      Total: ₦{{ totalAmount() | number }}
    </span>
  </div>

  <div class="filter-row">
    <button class="filter-btn" [class.filter-btn--active]="filter() === 'all'" (click)="setFilter('all')">All</button>
    <button class="filter-btn" [class.filter-btn--active]="filter() === 'active'" (click)="setFilter('active')">Active</button>
    <button class="filter-btn" [class.filter-btn--active]="filter() === 'completed'" (click)="setFilter('completed')">Completed</button>
  </div>

  <div class="contribution-list">
    @for (c of filtered(); track c.id) {
      <div class="contribution-card">
        <div class="contribution-card__left">
          <div class="contribution-card__org-dot" [style.background]="c.orgColor"></div>
          <div class="contribution-card__body">
            <p class="contribution-card__program">{{ c.program }}</p>
            <span class="contribution-card__org">{{ c.org }}</span>
            <div class="contribution-card__meta">
              <span class="contribution-card__category">{{ c.category }}</span>
              <span class="contribution-card__date">{{ c.date }}</span>
            </div>
          </div>
        </div>
        <div class="contribution-card__right">
          <p class="contribution-card__amount">₦{{ c.amount | number }}</p>
          <p class="contribution-card__patients">{{ c.patientsReached }} patients</p>
          <span class="contribution-card__status"
                [class.contribution-card__status--active]="c.status === 'Active'"
                [class.contribution-card__status--completed]="c.status === 'Completed'">
            {{ c.status }}
          </span>
        </div>
      </div>
    }
  </div>
</div>

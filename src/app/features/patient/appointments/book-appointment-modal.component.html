<div class="bam-overlay" (click)="onOverlayClick($event)">
  <div class="bam-card" role="dialog" aria-modal="true" aria-labelledby="bam-title">

    <!-- ── Header ─────────────────────────────────────────────── -->
    <div class="bam-header">
      <div class="bam-header__icon-wrap">
        <span class="bam-header__icon">📅</span>
      </div>
      <div>
        <h2 class="bam-header__title" id="bam-title">Book Appointment</h2>
        <p class="bam-header__sub">Schedule a visit with your healthcare team</p>
      </div>
      <button class="bam-header__close" type="button" (click)="close.emit()" aria-label="Close">&#x2715;</button>
    </div>

    <form #f="ngForm" (ngSubmit)="submit(f)" novalidate>
      <div class="bam-body">

        <!-- ── Section: Appointment Details ──────────────────── -->
        <div class="bam-section">
          <span class="bam-section__label">Appointment Details</span>
          <div class="bam-section__card">

            <div class="bam-row">
              <div class="bam-field">
                <label for="bam-date">
                  <span class="bam-field__icon">🗓️</span> Date
                </label>
                <input id="bam-date" type="date" name="isoDate"
                       [(ngModel)]="form.isoDate" [min]="todayISO" required>
              </div>
              <div class="bam-field">
                <label for="bam-time">
                  <span class="bam-field__icon">⏰</span> Time
                </label>
                <input id="bam-time" type="time" name="time24"
                       [(ngModel)]="form.time24" required>
              </div>
            </div>

            <div class="bam-row">
              <div class="bam-field">
                <label for="bam-provider">
                  <span class="bam-field__icon">👨‍⚕️</span> Provider / Doctor
                </label>
                <input id="bam-provider" type="text" name="provider"
                       [(ngModel)]="form.provider" required
                       placeholder="e.g. Dr. Sarah Chen">
              </div>
              <div class="bam-field">
                <label>
                  <span class="bam-field__icon">🏥</span> Specialty
                </label>
                <lc-specialty-select [value]="form.specialty" (valueChange)="form.specialty = $event" />
              </div>
            </div>

          </div>
        </div>

        <!-- ── Section: Visit Info ────────────────────────────── -->
        <div class="bam-section">
          <span class="bam-section__label">Visit Info</span>
          <div class="bam-section__card">

            <div class="bam-row">
              <div class="bam-field">
                <label>
                  <span class="bam-field__icon">🩺</span> Type
                </label>
                <lc-color-select
                  [options]="typeOptions"
                  [value]="form.type"
                  (valueChange)="form.type = $any($event)"
                  placeholder="Select a type" />
              </div>
              <div class="bam-field">
                <label>
                  <span class="bam-field__icon">⏱️</span> Duration
                </label>
                <lc-color-select
                  [options]="durationOptions"
                  [value]="form.duration"
                  (valueChange)="form.duration = $event"
                  placeholder="Select duration" />
              </div>
            </div>

            <div class="bam-field">
              <label for="bam-facility">
                <span class="bam-field__icon">📍</span> Clinic / Facility
              </label>
              <input id="bam-facility" type="text" name="facility"
                     [(ngModel)]="form.facility" required
                     placeholder="e.g. Lucen Health Centre, Lagos">
            </div>

          </div>
        </div>

        <!-- ── Section: Prep Note ─────────────────────────────── -->
        <div class="bam-section">
          <span class="bam-section__label">Preparation</span>
          <div class="bam-section__card">
            <div class="bam-field">
              <label for="bam-note">
                <span class="bam-field__icon">📝</span> Prep Note
                <span class="bam-field__optional">(optional)</span>
              </label>
              <textarea id="bam-note" name="note" [(ngModel)]="form.note"
                        placeholder="e.g. Fast for 8 hours, bring medication list…"></textarea>
            </div>
          </div>
        </div>

        @if (error()) {
          <p class="bam-field__error">{{ error() }}</p>
        }
      </div>

      <!-- ── Footer ─────────────────────────────────────────── -->
      <div class="bam-footer">
        <button type="button" class="bam-cancel-btn" (click)="close.emit()">Cancel</button>
        <button type="submit" class="bam-save-btn" [disabled]="f.invalid || !form.specialty">
          <span>Save Appointment</span>
          <span class="bam-save-btn__icon">→</span>
        </button>
      </div>
    </form>

  </div>
</div>
